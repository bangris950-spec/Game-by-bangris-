  <style>
/* BANG RIS GAME HUB — Dark Gaming Premium */
:root{--bg:#090B10;--bg2:#11151E;--p:#8B5CF6;--c:#00D9FF;--tx:#F5F7FA;--mu:#9299A8;--line:rgba(255,255,255,.09);--r:16px;--max:1160px;--f:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--fh:"Sora","Inter",system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:400 1rem/1.65 var(--f);overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
ul,ol{list-style:none;padding:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--c);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:1rem;top:-4rem;background:var(--p);padding:.6rem 1rem;border-radius:8px;z-index:100}
.skip:focus{top:1rem}
.wrap{width:min(100% - 2rem,var(--max));margin-inline:auto}
.ic{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{font-family:var(--fh);line-height:1.2;letter-spacing:-.01em}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:44px;padding:.65rem 1.2rem;border-radius:12px;border:1px solid transparent;font-weight:600;font-size:.92rem;transition:background .2s,box-shadow .2s,border-color .2s;text-align:center}
.btn-primary{background:var(--p);color:#fff}
.btn-primary:hover{background:#9d74f8;box-shadow:0 0 0 4px rgba(139,92,246,.2),0 8px 24px rgba(139,92,246,.3)}
.btn-ghost{background:rgba(255,255,255,.04);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--c);background:rgba(0,217,255,.06)}
.btn-disabled{background:var(--bg2);border-color:var(--line);color:var(--mu);cursor:not-allowed}

/* Header */
.site-header{position:sticky;top:0;z-index:50;background:rgba(9,11,16,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;min-height:68px}
.logo{display:inline-flex;align-items:center;gap:.6rem;font-family:var(--fh);font-weight:700;letter-spacing:.06em}
.logo img{border-radius:8px}
.menu{display:flex;align-items:center;gap:1.5rem}
.menu ul{display:flex;gap:.25rem}
.menu ul a{display:block;padding:.5rem .9rem;border-radius:10px;color:var(--mu);font-weight:500;font-size:.95rem;transition:color .2s}
.menu ul a:hover,.menu ul a[aria-current="true"]{color:var(--tx)}
.menu ul a[aria-current="true"]{box-shadow:inset 0 -2px 0 var(--p)}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:10px;width:44px;height:44px;align-items:center;justify-content:center}
.menu-btn .ic{width:1.4rem;height:1.4rem}

/* Hero */
.hero{position:relative;padding:clamp(4rem,12vw,8rem) 0 clamp(4rem,10vw,6.5rem);overflow:hidden;border-bottom:1px solid var(--line);background:radial-gradient(60% 70% at 85% 0%,rgba(139,92,246,.22),transparent 70%),radial-gradient(45% 55% at 0% 100%,rgba(0,217,255,.1),transparent 70%)}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:linear-gradient(180deg,#000 10%,transparent 85%);mask-image:linear-gradient(180deg,#000 10%,transparent 85%);opacity:.55}
.hero-in{position:relative;animation:enter .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.tag{display:inline-block;color:var(--c);font-size:.85rem;font-weight:500;margin-bottom:1.2rem;padding:.3rem .8rem;border:1px solid rgba(0,217,255,.3);border-radius:99px;background:rgba(0,217,255,.06)}
.hero h1{font-size:clamp(2.2rem,7vw,4.4rem);font-weight:700;max-width:14ch}
.lead{color:var(--mu);font-size:clamp(1.02rem,2.2vw,1.2rem);max-width:52ch;margin:1.4rem 0 2rem}
.lead.sm{font-size:1.05rem;margin:.8rem 0 0}
.cta{display:flex;flex-wrap:wrap;gap:.8rem}
.slogan{margin-top:2.6rem;font-family:var(--fh);font-size:.8rem;letter-spacing:.18em;color:var(--mu)}

/* Sections */
.section{padding:clamp(3.5rem,8vw,5.5rem) 0;scroll-margin-top:68px}
.section.alt{background:var(--bg2);border-block:1px solid var(--line)}
.sec-head{margin-bottom:2rem}
.sec-head h2,.about h2{font-size:clamp(1.6rem,4vw,2.2rem)}
.sec-head p{color:var(--mu);margin-top:.4rem}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:1.25rem}
.card{display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:border-color .2s,transform .2s}
.section.alt .card{background:var(--bg)}
.card:hover{border-color:rgba(139,92,246,.5);transform:translateY(-3px)}
.cover{position:relative;aspect-ratio:16/9;background:#0D1018;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:contain}
.cover-fb{width:100%;height:100%;display:grid;place-items:center;padding:1rem;text-align:center;font-family:var(--fh);font-weight:700;font-size:1.3rem;background:radial-gradient(70% 90% at 80% 20%,rgba(139,92,246,.4),transparent),#0D1018}
.badges{position:absolute;left:.8rem;top:.8rem;right:.8rem;display:flex;flex-wrap:wrap;gap:.4rem}
.badge{font-size:.72rem;font-weight:600;padding:.25rem .65rem;border-radius:99px;background:rgba(9,11,16,.75);backdrop-filter:blur(8px);border:1px solid var(--line)}
.b-first{background:var(--p);border-color:transparent;color:#fff}
.card-body{display:flex;flex-direction:column;gap:.55rem;padding:1.25rem;flex:1}
.meta{color:var(--c);font-size:.82rem;font-weight:500}
.card h3{font-size:1.3rem}
.desc{color:var(--mu);font-size:.95rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.facts{display:flex;flex-wrap:wrap;gap:.4rem 1rem;color:var(--mu);font-size:.85rem}
.actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:auto;padding-top:.9rem}
.actions .btn{flex:1 1 140px}
.card.lead-card{grid-column:1/-1;border-color:rgba(139,92,246,.45);box-shadow:0 0 60px rgba(139,92,246,.1)}
@media(min-width:820px){.card.lead-card{flex-direction:row}.lead-card .cover{flex:1.15;aspect-ratio:auto;min-height:320px}.lead-card .card-body{flex:1;padding:2rem;justify-content:center}.lead-card .card-body h3{font-size:1.9rem}.lead-card .desc{-webkit-line-clamp:5}}
.skeleton{height:280px;border-radius:var(--r);background:linear-gradient(90deg,var(--bg) 25%,#171c28 50%,var(--bg) 75%);background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* Filters */
.filters{display:grid;gap:.75rem;grid-template-columns:repeat(2,1fr);margin-bottom:1rem}
.filters .search{grid-column:1/-1;position:relative;display:block}
.filters .search .ic{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--mu)}
.filters input,.filters select{width:100%;min-height:46px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:.6rem 1rem}
.filters input{padding-left:2.8rem}
.filters select{appearance:none;-webkit-appearance:none;padding-right:2.2rem;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.filters input:focus,.filters select:focus{border-color:var(--c);outline:none;box-shadow:0 0 0 3px rgba(0,217,255,.15)}
@media(min-width:900px){.filters{grid-template-columns:2fr 1fr 1fr 1fr 1fr}.filters .search{grid-column:auto}}
.count{color:var(--mu);font-size:.9rem;margin-bottom:1rem}
.empty{text-align:center;padding:3.5rem 1rem;border:1px dashed var(--line);border-radius:var(--r);display:grid;justify-items:center;gap:.6rem}
.empty[hidden]{display:none}
.empty .ic{width:2rem;height:2rem;color:var(--p)}
.empty p{color:var(--mu)}

/* Updates */
.updates{display:grid;gap:.9rem}
.up{display:grid;gap:.4rem;padding:1.25rem 1.4rem;background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--p);border-radius:var(--r)}
.up-top{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .9rem}
.up h3{font-size:1.1rem}
.pill{font-size:.75rem;font-weight:600;padding:.2rem .7rem;border-radius:99px;background:rgba(139,92,246,.18);color:#c4b0ff}
.up time{color:var(--mu);font-size:.85rem;display:inline-flex;align-items:center;gap:.35rem}
.up ul{color:var(--mu);font-size:.95rem;padding-left:1.1rem;list-style:disc}
.up button{justify-self:start;background:none;border:0;color:var(--c);font-weight:600;font-size:.9rem;padding:.4rem 0;min-height:36px}

/* About / Footer */
.about{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1.5rem}
.who{font-family:var(--fh);font-size:1.15rem;color:var(--c);margin-top:.6rem}
.site-footer{padding:3.5rem 0 1.5rem}
.foot{display:grid;gap:2rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));padding-bottom:2rem}
.foot-brand p{color:var(--mu);margin-top:.8rem;max-width:36ch;font-size:.95rem}
.foot h3{font-size:.95rem;margin-bottom:.7rem}
.foot li a{display:inline-block;color:var(--mu);padding:.25rem 0}
.foot li a:hover{color:var(--tx)}
.legal{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem;padding-top:1.4rem;border-top:1px solid var(--line);color:var(--mu);font-size:.85rem}
[hidden]{display:none!important}
.noscript{padding:1rem;text-align:center;background:var(--bg2)}

/* Modal */
dialog{border:1px solid var(--line);border-radius:20px;background:var(--bg2);color:var(--tx);width:min(100% - 1.5rem,860px);max-height:90vh;padding:0;overflow:auto;margin:auto;overscroll-behavior:contain}
dialog::backdrop{background:rgba(5,6,10,.78);backdrop-filter:blur(4px)}
dialog[open]{animation:enter .25s ease-out}
.close{position:sticky;top:.8rem;float:right;margin:.8rem .8rem 0 0;z-index:3;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(9,11,16,.85);display:grid;place-items:center}
.close:hover{border-color:var(--c)}
.m-cover{aspect-ratio:16/9;background:#0D1018;margin-top:-52px}
.m-cover img,.m-cover .cover-fb{width:100%;height:100%;object-fit:contain}
.m-body{padding:clamp(1.2rem,4vw,2rem);display:grid;gap:1.6rem}
.m-body h2{fo
