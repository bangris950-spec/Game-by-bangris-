<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Game Developer Life</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0b0e14;font-family:"Courier New",monospace;color:#dfe6f5;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;width:100%;height:100%}
#app{position:fixed;inset:0}
#hud{position:fixed;top:0;left:0;right:0;padding:6px 8px;display:flex;flex-direction:column;gap:4px;pointer-events:none;z-index:10}
.hudrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;font-weight:bold}
.hudrow span{background:rgba(10,14,22,.78);border:2px solid #2b3550;border-radius:5px;padding:2px 7px}
#hMoney{color:#7ee081}#hTime{color:#9fc7ff}#hPower.on{color:#ffd166}#hPower.off{color:#ff5c5c;animation:blink .8s infinite}
@keyframes blink{50%{opacity:.3}}
.ebar{width:96px;height:12px;background:rgba(10,14,22,.78);border:2px solid #2b3550;border-radius:5px;overflow:hidden}
#eFill{height:100%;width:100%;background:linear-gradient(90deg,#4be07a,#a6e34b);transition:width .2s}
#eFill.low{background:linear-gradient(90deg,#e04b4b,#e0864b)}
#prompt{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:rgba(10,14,22,.85);border:2px solid #4a6ba8;border-radius:6px;padding:5px 12px;font-size:12px;font-weight:bold;color:#cfe2ff;z-index:12;white-space:nowrap;pointer-events:none}
#prompt.hidden{display:none}
#stickArea{position:fixed;left:0;bottom:0;width:170px;height:170px;z-index:20}
#stickBase{position:absolute;left:18px;bottom:18px;width:120px;height:120px;border-radius:50%;background:rgba(20,28,44,.55);border:3px solid #33456b}
#stickKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:0;border-radius:50%;background:#4a6ba8;border:3px solid #7fa4e0;transform:translate(-50%,-50%);pointer-events:none}
#rightBtns{position:fixed;right:14px;bottom:24px;display:flex;flex-direction:column;gap:12px;z-index:20;align-items:center}
.gbtn{font-family:inherit;font-weight:bold;font-size:16px;color:#eaf2ff;background:linear-gradient(#2f3f60,#1d2740);border:3px solid #4a6ba8;border-radius:10px;padding:12px 0;width:74px;cursor:pointer;box-shadow:0 3px 0 #121a2b}
.gbtn:active{transform:translateY(3px);box-shadow:none}
#btnE{background:linear-gradient(#3f7a4a,#245231);border-color:#4be07a;color:#c8ffd8}
#btnMusic{position:fixed;top:60px;right:14px;z-index:30;width:44px;height:44px;font-size:18px;padding:0;border-radius:50%;background:#1d2740;border:3px solid #4a6ba8;cursor:pointer;box-shadow:0 3px 0 #121a2b;color:#fff}
#btnMusic:active{transform:translateY(3px);box-shadow:none}
.gbtn.wide{width:100%;margin-top:10px;padding:10px 0;font-size:14px}
#toastBox{position:fixed;left:50%;top:70px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:60;pointer-events:none;align-items:center;width:92%;max-width:420px}
.toast{background:rgba(16,22,34,.95);border:2px solid #4a6ba8;border-radius:6px;padding:7px 12px;font-size:12px;font-weight:bold;color:#dbe9ff;animation:tin .25s;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
#modal{position:fixed;inset:0;background:rgba(4,7,12,.78);display:flex;align-items:center;justify-content:center;padding:10px;z-index:80}
#modal.hidden{display:none}
#modalBox{background:#141a26;border:3px solid #3a4a6b;border-radius:10px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:14px;box-shadow:0 10px 40px #000}
#modalTitle{font-size:15px;color:#8fd3ff;margin-bottom:10px;border-bottom:2px dashed #2b3550;padding-bottom:8px}
#modalBody{font-size:12px;line-height:1.55}
#modalBody h3{font-size:12px;color:#8fd3ff;margin:12px 0 6px}
#modalBody .dim{color:#8a97b3;font-size:11px}
#modalBody .big{font-size:20px;color:#7ee081;font-weight:bold}
#modalBody .card{background:#1b2333;border:2px solid #2b3550;border-radius:7px;padding:8px 10px;margin-bottom:8px}
#modalBody .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
#modalBody .price{color:#ffd166;font-weight:bold;margin-right:auto}
#modalBody .tag{background:#2b3550;color:#9fc7ff;border-radius:4px;padding:1px 6px;font-size:10px}
#modalBody button{font-family:inherit;font-weight:bold;font-size:11px;color:#eaf2ff;background:linear-gradient(#2f3f60,#1d2740);border:2px solid #4a6ba8;border-radius:6px;padding:7px 11px;cursor:pointer;box-shadow:0 2px 0 #121a2b}
#modalBody button:active{transform:translateY(2px);box-shadow:none}
#modalBody button.red{background:linear-gradient(#6b2f3f,#401d27);border-color:#c04a6a}
#modalBody button.green{background:linear-gradient(#2f6b3f,#1d4027);border-color:#4be07a}
#modalBody input{font-family:inherit;font-size:12px;padding:7px;border-radius:6px;border:2px solid #4a6ba8;background:#0f1420;color:#dfe6f5;width:100%;margin-top:6px}
#modalBody .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#modalBody .grid button{width:100%;padding:10px 4px}
#modalBody .bar2{height:9px;background:#0f1420;border-radius:5px;overflow:hidden;border:1px solid #2b3550;margin:5px 0}
#modalBody .bar2 > div{height:100%;background:linear-gradient(90deg,#4a6ba8,#8fd3ff)}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="hudrow">
      <span id="hMoney">💰 Rp150.000</span>

    </div>
  </div>
</div>
<script>"use strict";
const WORLD = { w: 1500, h: 780 }, ROOM  = { w: 640,  h: 448 }, SAVE_KEY = "gdl_save_v3", MIN_PER_SEC = 2;
const CAREERS = ["Beginner Developer","Junior Developer","Indie Developer","Professional Developer","Studio Owner","CEO Technology Company"];
const QUOTA_PACKS = [{ n:"1 GB", gb:1, p:5000 },{ n:"5 GB", gb:5, p:15000 },{ n:"10 GB", gb:10, p:25000 },{ n:"20 GB", gb:20, p:40000 }];
const WIFI_PLANS = { basic:{ n:"WiFi Basic", price:100000, install:50000, spd:1.2, cap:30 }, standard:{ n:"WiFi Standard", price:200000, install:100000, spd:2.0, cap:60 }, premium:{ n:"WiFi Premium", price:350000, install:150000, spd:3.0, cap:150 } };
const SERVER_PLANS = { free:{ n:"Server Gratis", cost:0, cap:2, desc:"Lambat" }, murah:{ n:"Server Murah", cost:5000, cap:6, desc:"Indie" }, menengah:{ n:"Server Menengah", cost:15000, cap:15, desc:"Studio" }, pro:{ n:"Server Profesional", cost:40000, cap:50, desc:"Perusahaan" } };
const ITEMS = {
  laptop_bagus:{ n:"Laptop Bagus", p:2500000, cat:"komputer", q:3, pw:65, toko:"komputer", desc:"Kualitas naik" },
  pc_rakitan:{ n:"PC Rakitan", p:4000000, cat:"komputer", q:4, pw:250, toko:"komputer", desc:"Performa mantap" },
  pc_pro:{ n:"PC Profesional", p:9000000, cat:"komputer", q:6, pw:400, toko:"komputer", desc:"Super cepat" },
  monitor:{ n:"Monitor 24\"", p:900000, cat:"periferal", q:1, pw:35, toko:"komputer", desc:"Fokus naik" },
  keyboard:{ n:"Keyboard Mekanik", p:350000, cat:"periferal", q:1, pw:3, toko:"komputer", desc:"Ngetik nyaman" },
  mouse:{ n:"Mouse Gaming", p:200000, cat:"periferal", q:1, pw:2, toko:"komputer", desc:"Presisi maksimal" },
  server_beli:{ n:"Server Pribadi", p:3000000, cat:"server", q:0, pw:300, toko:"komputer", desc:"Hosting 30 produk" },
  meja:{ n:"Meja Kerja", p:400000, cat:"furnitur", q:0, pw:0, toko:"furnitur", desc:"Rapi" },
  kursi:{ n:"Kursi Ergonomis", p:600000, cat:"furnitur", q:0, pw:0, toko:"furnitur", desc:"Energi awet" },
  lampu:{ n:"Lampu Meja", p:150000, cat:"furnitur", q:0, pw:15, toko:"furnitur", desc:"Cahaya" },
  kipas:{ n:"Kipas Angin", p:250000, cat:"furnitur", q:0, pw:45, toko:"furnitur", desc:"Adem" },
  ups:{ n:"UPS", p:800000, cat:"listrik", q:0, pw:0, toko:"elektronik", desc:"Backup daya" },
  genset:{ n:"Genset", p:3500000, cat:"listrik", q:0, pw:0, toko:"elektronik", desc:"Daya tanpa batas" },
  router:{ n:"Router WiFi", p:500000, cat:"internet", q:0, pw:10, toko:"elektronik", desc:"Perkuat sinyal" }
};
const BUILDINGS = [
  { id:"house", name:"KAMAR", x:120, y:120, w:200, h:140, c:"#8b6cf0", rc:"#5b3fd6", door:{x:220,y:260}, act:"room" },
  { id:"warnet", name:"WARNET", x:380, y:120, w:180, h:140, c:"#2ec4b6", rc:"#1a9e93", door:{x:470,y:260}, act:"warnet" },
  { id:"komputer", name:"TOKO KOMPUTER", x:620, y:120, w:220, h:140, c:"#ff9f1c", rc:"#d97e00", door:{x:730,y:260}, act:"shop:komputer" },
  { id:"kantor", name:"KANTOR", x:900, y:120, w:220, h:140, c:"#5b8def", rc:"#3a63b8", door:{x:1010,y:260}, act:"office" },
  { id:"elektronik", name:"TOKO ELEKTRONIK", x:1180,y:120, w:200, h:140, c:"#e5556e", rc:"#b23a50", door:{x:1280,y:260}, act:"shop:elektronik" },
  { id:"furnitur", name:"TOKO FURNITUR", x:120, y:440, w:200, h:140, c:"#c8a15a", rc:"#9a7740", door:{x:220,y:580}, act:"shop:furnitur" },
  { id:"konter", name:"KONTER PULSA", x:380, y:440, w:180, h:140, c:"#8ac926", rc:"#5f9416", door:{x:470,y:580}, act:"konter" }
];
const PARK = { x:620, y:430, w:300, h:180 };

let state, menuFn, cam = { x:0, y:0 }, minAcc = 0, autoSaveAcc = 0, lastDt = 0.016;
let keys = {}, stickId = null, sdx = 0, sdy = 0;

function defaultState(){
  return { v:3, money:150000, energy:100, maxEnergy:100, day:1, minutes:8*60, weather:"cerah", scene:"town",
    townPos:{ x:220, y:340, dir:"down" }, roomPos:{ x:320, y:340, dir:"up" }, quota:0, warnetCredits:0,
    wifi:{ installed:false, plan:null, active:false, used:0, dueDay:0 }, power:{ bs:0, be:0, upsCharge:100 },
    items:[], installed:[], products:[], projects:[], reputation:0, career:0, company:null,
    server:{ plan:"free", own:false }, totalIncome:0, totalExpense:0, log:[] };
}
const $ = id => document.getElementById(id);
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
function fmt(n){ return "Rp" + Math.round(n).toLocaleString("id-ID"); }
function absTime(){ return (state.day-1)*1440 + state.minutes; }
function hhmm(){ const m=Math.floor(state.minutes); return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
function curPos(){ return state.scene==="town" ? state.townPos : state.roomPos; }
function addLog(t){ state.log.push(`[Hari ${state.day} ${hhmm()}] ${t}`); if(state.log.length>60) state.log.shift(); }
function typeName(t){ return t==="game"?"Game":t==="app"?"Aplikasi":"Website"; }
function typeMult(t){ return t==="game"?1.25:t==="app"?1.0:0.8; }
function typeCost(t){ return t==="game"?10000:t==="app"?7500:5000; }
function typeEmoji(t){ return t==="game"?"🎮":t==="app"?"📱":"🌐"; }let audioCtx, musicInterval, isMusicPlaying = false;
function toggleMusic() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (isMusicPlaying) {
    clearInterval(musicInterval);
    isMusicPlaying = false;
    toast("🎵 Musik Dimatikan");
    $("btnMusic").textContent = "🎵";
  } else {
    isMusicPlaying = true;
    toast("🎵 Musik Dinyalakan");
    $("btnMusic").textContent = "🔇";
    playMelody();
  }
}
const melody = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 261.63, 196.00];
let noteIndex = 0;
function playMelody() {
  if (!isMusicPlaying) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.value = melody[noteIndex % melody.length];
  gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.4);
  noteIndex++;
  musicInterval = setTimeout(playMelody, 500);
}

function toast(msg){
  const box = $("toastBox"); const d = document.createElement("div");
  d.className = "toast"; d.textContent = msg; box.appendChild(d);
  setTimeout(()=>{ d.style.opacity="0"; d.style.transition="opacity .4s"; setTimeout(()=>d.remove(),400); }, 2200);
  while(box.children.length>4) box.removeChild(box.firstChild);
}
function isBlackout(){ const t = absTime(); return t >= state.power.bs && t < state.power.be; }
function hasInstalled(id){ return state.installed.includes(id); }
function consumePower(){
  if(!isBlackout()) return true;
  if(hasInstalled("genset")) return true;
  if(hasInstalled("ups") && state.power.upsCharge > 0){ state.power.upsCharge -= 18; return true; }
  return false;
}
function hasInternet(){ return (state.wifi.installed && state.wifi.active) || (state.quota > 0.01) || (state.warnetCredits > 0); }
function useInternet(gb){
  if(state.wifi.installed && state.wifi.active){ state.wifi.used += gb; return "wifi"; }
  if(state.quota > 0.01){ if(state.quota >= gb) state.quota -= gb; else state.quota = 0; return "kuota"; }
  if(state.warnetCredits > 0){ state.warnetCredits--; return "warnet"; }
  return null;
}
function internetSpeed(){
  if(state.wifi.installed && state.wifi.active){
    const p = WIFI_PLANS[state.wifi.plan]; let s = p ? p.spd : 1;
    if(hasInstalled("router")) s += 0.5; return s;
  }
  if(state.quota > 0.01) return 0.9;
  if(state.warnetCredits > 0) return 1.0;
  return 0;
}
function gearScore(){
  let base = 1, per = 0;
  for(const id of state.installed){ const it = ITEMS[id]; if(!it) continue; if(it.cat==="komputer") base = Math.max(base, it.q); if(it.cat==="periferal") per += it.q; }
  return base + Math.min(per, 3);
}
function totalPowerDraw(){ let w = 40; for(const id of state.installed){ const it = ITEMS[id]; if(it && it.pw) w += it.pw; } return w; }
function serverCapacity(){ if(state.server.own) return 30; return (SERVER_PLANS[state.server.plan]||SERVER_PLANS.free).cap; }
function serverDailyCost(){ if(state.server.own) return 0; return (SERVER_PLANS[state.server.plan]||SERVER_PLANS.free).cost; }
function careerLevel(){ const r=state.reputation; return r>=700?5:r>=400?4:r>=200?3:r>=90?2:r>=30?1:0; }
function checkCareer(){ const lv=careerLevel(); if(lv>state.career){ state.career=lv; toast("🎉 Naik level: "+CAREERS[lv]); addLog("Karier naik: "+CAREERS[lv]); updateHUD(); } }

function advanceTime(mins){
  state.minutes += mins;
  while(state.minutes >= 1440){ state.minutes -= 1440; state.day++; onNewDay(); }
  if(!isBlackout() && state.power.upsCharge < 100) state.power.upsCharge = Math.min(100, state.power.upsCharge + mins*0.5);
  updateHUD();
}
function onNewDay(){
  state.weather = Math.random() < 0.32 ? "hujan" : "cerah";
  state.power.bs = 0; state.power.be = 0;
  if(Math.random() < 0.30){ const base = (state.day-1)*1440, start = base + 6*60 + Math.floor(Math.random()*720); state.power.bs = start; state.power.be = start + 60 + Math.floor(Math.random()*120); }
  const net = hasInternet(), cap = serverCapacity(); let published = 0, income = 0;
  for(const p of state.products){
    if(!p.published || published >= cap) continue;
    published++;
    if(net){ p.popularity = Math.min(100, p.popularity + 8); const inc = Math.round(p.quality * 1200 * (p.popularity/100) * typeMult(p.type)); p.income += inc; income += inc; }
  }
  if(income > 0){ state.money += income; state.totalIncome += income; addLog("Pendapatan: +"+fmt(income)); state.reputation += Math.floor(income/10000); }
  let exp = 0, srv = serverDailyCost();
  if(srv>0){ exp += srv; addLog("Server: -"+fmt(srv)); }
  if(state.company){
    if(state.company.office){ exp += 60000; addLog("Kantor: -"+fmt(60000)); }
    let sal = 0; for(const e of state.company.employees) sal += e.salary;
    if(sal>0){ exp += sal; addLog("Gaji: -"+fmt(sal)); }
  }
  const listrik = 3000 + Math.round(totalPowerDraw()*8); exp += listrik; addLog("Listrik: -"+fmt(listrik));
  if(exp>0){ state.money = Math.max(0, state.money - exp); state.totalExpense += exp; }
  if(state.wifi.installed){
    if(state.day >= state.wifi.dueDay && state.wifi.active){ state.wifi.active = false; addLog("WiFi nonaktif"); toast("⚠️ WiFi nonaktif!"); }
    else if(state.wifi.active && state.day >= state.wifi.dueDay - 3){ toast("📶 Tagihan WiFi mendekat!"); }
  }
  checkCareer(); updateHUD(); saveGame(true);
}
function buyQuota(i){ const q=QUOTA_PACKS[i]; if(state.money<q.p){toast("💸 Uang kurang");return;} state.money-=q.p; state.totalExpense+=q.p; state.quota+=q.gb; addLog("Beli kuota"); toast("✅ Kuota +"+q.n); rerender(); updateHUD(); }
function installWifi(k){ const p=WIFI_PLANS[k], tot=p.install+p.price; if(state.money<tot){toast("💸 Butuh "+fmt(tot));return;} state.money-=tot; state.totalExpense+=tot; state.wifi={installed:true,plan:k,active:true,used:0,dueDay:state.day+30}; addLog("Pasang WiFi"); toast("✅ WiFi terpasang!"); rerender(); updateHUD(); }
function changeWifi(k){ const p=WIFI_PLANS[k]; if(state.wifi.plan===k){toast("Sudah pakai ini");return;} if(state.money<p.price){toast("💸 Uang kurang");return;} state.money-=p.price; state.totalExpense+=p.price; state.wifi={installed:true,plan:k,active:true,used:0,dueDay:state.day+30}; toast("✅ Paket diganti"); rerender(); updateHUD(); }
function payWifi(){ if(!state.wifi.installed){toast("Tidak ada WiFi");return;} const p=WIFI_PLANS[state.wifi.plan]; if(state.money<p.price){toast("💸 Uang kurang");return;} state.money-=p.price; state.totalExpense+=p.price; state.wifi.active=true; state.wifi.used=0; state.wifi.dueDay=state.day+30; toast("✅ Tagihan dibayar"); rerender(); updateHUD(); }
function stopWifi(){ state.wifi={installed:false,plan:null,active:false,used:0,dueDay:0}; toast("WiFi berhenti"); rerender(); updateHUD(); }
function buyWarnet(){ if(state.money<5000){toast("💸 Uang kurang");return;} state.money-=5000; state.totalExpense+=5000; state.warnetCredits+=3; toast("✅ +3 aksi warnet"); rerender(); updateHUD(); }
function buyItem(id){ const it=ITEMS[id]; if(state.items.includes(id)||state.installed.includes(id)){toast("Sudah punya");return;} if(state.money<it.p){toast("💸 Uang kurang");return;} state.money-=it.p; state.totalExpense+=it.p; state.items.push(id); toast("✅ "+it.n+" dibeli"); rerender(); updateHUD(); }
function installItem(id){ const i=state.items.indexOf(id); if(i<0)return; state.items.splice(i,1); state.installed.push(id); toast("🔧 Terpasang"); rerender(); updateHUD(); }
function uninstallItem(id){ const i=state.installed.indexOf(id); if(i<0)return; state.installed.splice(i,1); state.items.push(id); toast("📦 Dilepas"); rerender(); updateHUD(); }
function sellItem(id){ const i=state.items.indexOf(id); if(i<0)return; const val=Math.floor(ITEMS[id].p*0.5); state.items.splice(i,1); state.money+=val; state.totalIncome+=val; toast("💵 Terjual "+fmt(val)); rerender(); updateHUD(); }function startProject(type){
  const cost=typeCost(type); if(state.money<cost){toast("💸 Uang kurang");return;} if(!consumePower()){toast("⚡ Listrik mati!");return;}
  state.money-=cost; state.totalExpense+=cost;
  const names={game:["Petualangan Pixel","Space Runner","Ninja Kucing","Raja Nusantara"],app:["Catatan Harian","Kasir UMKM","Dompet Digital"],web:["Toko Online","Portfolio Studio","Blog Teknologi"]};
  const nm=names[type][Math.floor(Math.random()*names[type].length)]+" "+(Math.floor(Math.random()*90)+10);
  state.projects.push({name:nm,type:type,progress:0}); toast("📁 Proyek dimulai"); menuProjects(); updateHUD();
}
function workProject(i){
  const p=state.projects[i]; if(!p)return; if(!consumePower()){toast("⚡ Listrik mati!");return;} if(state.energy<12){toast("😴 Energi kurang");return;}
  state.energy-=12; advanceTime(60);

const stickBase=$("stickBase"), stickKnob=$("stickKnob");
function moveStick(e){ const r=stickBase.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2; let dx=e.clientX-cx,dy=e.clientY-cy; const d=Math.hypot(dx,dy),max=r.width/2-8; if(d>max){dx=dx/d*max;dy=dy/d*max;} stickKnob.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`; sdx=dx/max; sdy=dy/max; }
stickBase.addEventListener("pointerdown",e=>{e.preventDefault();stickId=e.pointerId;try{stickBase.setPointerCapture(e.pointerId);}catch(_){}moveStick(e);});
stickBase.addEventListener("pointermove",e=>{if(e.pointerId===stickId)moveStick(e);});
function endStick(e){if(e.pointerId!==stickId)return;stickId=null;sdx=0;sdy=0;stickKnob.style.transform="translate(-50%,-50%)";}

function canMove(x,y,scene){
  if(scene==="town"){ if(x<24||x>WORLD.w-24||y<90||y>WORLD.h-24)return false; for(const b of BUILDINGS){ if(x>b.x-10&&x<b.x+b.w+10&&y>b.y-10&&y<b.y+b.h+8)return false; } return true; }
  else { if(x<52||x>ROOM.w-52||y<118||y>ROOM.h-32)return false; if(x>60&&x<190&&y>268&&y<360)return false; if(x>392&&x<560&&y>78&&y<175)return false; return true; }
}

function update(dt){
  lastDt=dt; if(modalOpen())return;
  const pos=curPos(), scene=state.scene; let ix=0,iy=0;
  if(keys["w"]||keys["arrowup"])iy--; if(keys["s"]||keys["arrowdown"])iy++; if(keys["a"]||keys["arrowleft"])ix--; if(keys["d"]||keys["arrowright"])ix++;
  if(Math.abs(sdx)>0.18)ix+=sdx; if(Math.abs(sdy)>0.18)iy+=sdy;
  const mag=Math.hypot(ix,iy); if(mag>1){ix/=mag;iy/=mag;}
  const speed=115;
  if(ix!==0||iy!==0){
    const nx=pos.x+ix*speed*dt, ny=pos.y+iy*speed*dt;
    if(canMove(nx,pos.y,scene))pos.x=nx; if(canMove(pos.x,ny,scene))pos.y=ny;
    if(Math.abs(ix)>Math.abs(iy))pos.dir=ix>0?"right":"left"; else pos.dir=iy>0?"down":"up";
    pos.anim=(pos.anim||0)+dt*11;
    let drain=0.35; if(state.installed.includes("kursi"))drain*=0.9; state.energy=Math.max(0,state.energy-drain*dt);
  } else { pos.anim=0; }
  minAcc+=dt*MIN_PER_SEC; if(minAcc>=1){const m=Math.floor(minAcc);minAcc-=m;advanceTime(m);}
  autoSaveAcc+=dt; if(autoSaveAcc>45){autoSaveAcc=0;saveGame(true);}
  updatePrompt(); updateHUD();
}

  const el=$("prompt"); if(modalOpen()){el.classList.add("hidden");return;} let txt="";
  if(state.scene==="town"){
    const b=nearestBuilding(); if(b){ txt="E — "+b.name; } else if(nearPark()){ txt="E — Istirahat"; }
  } else { const o=nearestRoomObj(); if(o)txt="E — "+o.label; }
  if(txt){el.textContent=txt;el.classList.remove("hidden");}else el.classList.add("hidden");
}

function drawChar(x,y,dir,anim,colors){
  const bob=Math.sin(anim)*1.5; ctx.fillStyle="rgba(0,0,0,.25)"; ctx.beginPath(); ctx.ellipse(x,y,11,4,0,0,Math.PI*2); ctx.fill();
  const lo=Math.sin(anim)*3; ctx.fillStyle=colors.pants; ctx.fillRect(x-7,y-14+Math.max(0,lo),6,14); ctx.fillRect(x+1,y-14+Math.max(0,-lo),6,14);
  ctx.fillStyle=colors.shirt; ctx.fillRect(x-8,y-31+bob,16,18); ctx.fillStyle=colors.skin; ctx.fillRect(x-6,y-47+bob,12,14);
  ctx.fillStyle=colors.hair; ctx.fillRect(x-7,y-49+bob,14,7); ctx.fillStyle="#1b1b25";
  if(dir==="down"){ctx.fillRect(x-4,y-42+bob,2,3);ctx.fillRect(x+2,y-42+bob,2,3);} else if(dir==="left"){ctx.fillRect(x-5,y-42+bob,2,3);} else if(dir==="right"){ctx.fillRect(x+3,y-42+bob,2,3);} else {ctx.fillRect(x-4,y-42+bob,8,2);}
}
const PLAYER_COLORS={shirt:"#4a7bd6",pants:"#26344d",skin:"#f0c090",hair:"#2a2028"};
const NPC_COLORS=[{shirt:"#e07a4a",pants:"#3b2b2b",skin:"#e8b98a",hair:"#1d1d24"},{shirt:"#6ad06a",pants:"#22303a",skin:"#d8a878",hair:"#33261c"},{shirt:"#c96ad0",pants:"#2a2233",skin:"#f2cba0",hair:"#241a20"}];
const npcs=[{x:520,y:430,hx:520,hy:430,t:0,c:0},{x:980,y:430,hx:980,hy:430,t:1.7,c:1},{x:300,y:640,hx:300,hy:640,t:3.1,c:2}];
function updateNPCs(dt){ for(const n of npcs){ n.t+=dt*0.7; n.x=n.hx+Math.sin(n.t)*55; n.y=n.hy+Math.cos(n.t*0.8)*22; } }

function drawTown(){
  for(let x=0;x<WORLD.w;x+=128)for(let y=0;y<WORLD.h;y+=128){ctx.fillStyle=((x/128+y/128)%2===0)?"#4a9c4a":"#439043";ctx.fillRect(x,y,128,128);}
  ctx.fillStyle="#8a8f9c"; ctx.fillRect(0,288,WORLD.w,12); ctx.fillRect(0,400,WORLD.w,12);
  ctx.fillStyle="#5a5f6b"; ctx.fillRect(0,300,WORLD.w,100); ctx.fillStyle="#e8e8a0"; for(let x=20;x<WORLD.w;x+=90)ctx.fillRect(x,346,46,8);
  ctx.fillStyle="#3f8a3f"; ctx.fillRect(PARK.x,PARK.y,PARK.w,PARK.h); ctx.fillStyle="#5aa85a"; ctx.fillRect(PARK.x+8,PARK.y+8,PARK.w-16,PARK.h-16);
  const trees=[[PARK.x+50,PARK.y+55],[PARK.x+150,PARK.y+45],[PARK.x+230,PARK.y+90],[PARK.x+90,PARK.y+130]];
  for(const [tx,ty] of trees){ ctx.fillStyle="#5a3a1a"; ctx.fillRect(tx-5,ty,10,26); ctx.fillStyle="#2f7a34"; ctx.beginPath();ctx.arc(tx,ty-6,22,0,Math.PI*2);ctx.fill(); ctx.fillStyle="#3f9c46"; ctx.beginPath();ctx.arc(tx-7,ty-14,14,0,Math.PI*2);ctx.fill(); }
  ctx.fillStyle="#8a5a2a"; ctx.fillRect(PARK.x+185,PARK.y+140,56,10); ctx.fillRect(PARK.x+185,PARK.y+152,56,6);
  for(const b of BUILDINGS){
    ctx.fillStyle="rgba(0,0,0,.20)"; ctx.fillRect(b.x+8,b.y+b.h-2,b.w,12);
    ctx.fillStyle=b.c; ctx.fillRect(b.x,b.y,b.w,b.h); ctx.strokeStyle="rgba(0,0,0,.28)"; ctx.lineWidth=3; ctx.strokeRect(b.x,b.y,b.w,b.h);
    ctx.fillStyle=b.rc; ctx.fillRect(b.x-9,b.y-26,b.w+18,32); ctx.fillStyle="rgba(255,255,255,.16)"; ctx.fillRect(b.x-9,b.y-26,b.w+18,6);
    const wy=b.y+26, cols=Math.max(2,Math.floor(b.w/70)), gap=b.w/(cols+1);
    for(let i=0;i<cols;i++){ const wx=b.x+gap*(i+1)-15; ctx.fillStyle="#bfe6ff"; ctx.fillRect(wx,wy,30,26); ctx.fillStyle="rgba(0,0,0,.35)"; ctx.fillRect(wx+13,wy,4,26); ctx.fillRect(wx,wy+11,30,4); }
    const dx=b.door.x; ctx.fillStyle="#3a2b1a"; ctx.fillRect(dx-19,b.y+b.h-52,38,52); ctx.fillStyle="#5c452a"; ctx.fillRect(dx-15,b.y+b.h-48,30,44); ctx.fillStyle="#ffd166"; ctx.fillRect(dx+8,b.y+b.h-28,4,4);
    ctx.font="bold 11px monospace"; ctx.textAlign="center"; ctx.textBaseline="middle"; const tw=ctx.measureText(b.name).width;
    ctx.fillStyle="rgba(0,0,0,.62)"; ctx.fillRect(dx-tw/2-7,b.y+b.h-76,tw+14,18); ctx.fillStyle="#fff2c8"; ctx.fillText(b.name,dx,b.y+b.h-67); ctx.textAlign="left"; ctx.textBaseline="alphabetic";
  }
  for(const n of npcs)drawChar(n.x,n.y,"down",n.t*6,NPC_COLORS[n.c]);
  const p=state.townPos; drawChar(p.x,p.y,p.dir,p.anim||0,PLAYER_COLORS);
}
function drawRoom(){
  for(let y=0;y<ROOM.h;y+=32)for(let x=0;x<ROOM.w;x+=32){ctx.fillStyle=((x/32+y/32)%2===0)?"#8a6a45":"#7d5f3d";ctx.fillRect(x,y,32,32);}
  ctx.fillStyle="#3a3050"; ctx.fillRect(0,0,ROOM.w,88); ctx.fillStyle="#4a3f66"; ctx.fillRect(0,80,ROOM.w,10);
  ctx.fillStyle="#2a2438"; ctx.fillRect(0,0,36,ROOM.h); ctx.fillRect(ROOM.w-36,0,36,ROOM.h); ctx.fillRect(0,ROOM.h-24,ROOM.w,24);
  ctx.fillStyle="#20304a"; ctx.fillRect(70,16,70,48); ctx.fillStyle="#4a7bd6"; ctx.fillRect(76,22,58,36); ctx.fillStyle="#ffd166"; ctx.fillRect(88,32,34,6); ctx.fillRect(88,44,22,4);
  ctx.fillStyle="#bfe6ff"; ctx.fillRect(480,18,96,52); ctx.fillStyle="rgba(0,0,0,.35)"; ctx.fillRect(524,18,6,52); ctx.fillRect(480,40,96,6);
  ctx.fillStyle="#6b4a2a"; ctx.fillRect(58,268,130,88); ctx.fillStyle="#d9dce8"; ctx.fillRect(62,272,122,78); ctx.fillStyle="#7fa4e0"; ctx.fillRect(62,272,122,26); ctx.fillStyle="#ffffff"; ctx.fillRect(74,276,40,18);
  ctx.fillStyle="#5c452a"; ctx.fillRect(392,96,168,74); ctx.fillStyle="#7a5c38"; ctx.fillRect(392,96,168,12);
  ctx.fillStyle="#20242e"; ctx.fillRect(440,62,62,42); ctx.fillStyle="#3f8fd0"; ctx.fillRect(444,66,54,32); ctx.fillStyle="#9fd8ff"; ctx.fillRect(450,74,42,3); ctx.fillRect(450,82,30,3); ctx.fillStyle="#2b3040"; ctx.fillRect(434,100,74,10);
  ctx.fillStyle="#333a4a"; ctx.fillRect(470,190,44,12); ctx.fillRect(504,158,10,44);
  ctx.fillStyle="#3a2b1a"; ctx.fillRect(288,404,64,32); ctx.fillStyle="#5c452a"; ctx.fillRect(292,408,56,28);
  ctx.fillStyle="rgba(120,90,200,.28)"; ctx.fillRect(240,240,150,90);
  const p=state.roomPos; drawChar(p.x,p.y,p.dir,p.anim||0,PLAYER_COLORS);
}
function drawLighting(){
  ctx.setTransform(1,0,0,1,0,0); const m=state.minutes; let a=0;
  if(m<300)a=0.62; else if(m<390)a=0.62*(1-(m-300)/90); else if(m<1020)a=0; else if(m<1170)a=0.62*((m-1020)/150); else a=0.62;
  if(a>0.01){ctx.fillStyle="rgba(10,16,48,"+a.toFixed(3)+")";ctx.fillRect(0,0,W,H);}
  if(state.weather==="hujan"){ctx.fillStyle="rgba(20,30,60,0.18)";ctx.fillRect(0,0,W,H);}
}
function drawRain(dt){
  if(state.weather!=="hujan")return; ctx.setTransform(1,0,0,1,0,0); ctx.strokeStyle="rgba(180,210,255,.45)"; ctx.lineWidth=1.5; ctx.beginPath();
  for(const d of drops){ d.y+=d.s*dt; d.x-=40*dt; if(d.y>H){d.y=-20;d.x=Math.random()*W;} if(d.x<-20)d.x=W+20; ctx.moveTo(d.x,d.y); ctx.lineTo(d.x-4,d.y+12); } ctx.stroke();
}
function render(){
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,W,H); ctx.imageSmoothingEnabled=false;
  const scene=state.scene, wW=scene==="town"?WORLD.w:ROOM.w, wH=scene==="town"?WORLD.h:ROOM.h, pos=curPos(), viewW=W/ZOOM, viewH=H/ZOOM;
  cam.x=wW<=viewW?(wW-viewW)/2:clamp(pos.x-viewW/2,0,wW-viewW); cam.y=wH<=viewH?(wH-viewH)/2:clamp(pos.y-viewH/2,0,wH-viewH);
  ctx.setTransform(ZOOM,0,0,ZOOM,-cam.x*ZOOM,-cam.y*ZOOM);
  if(scene==="town")drawTown(); else drawRoom();
  drawLighting(); drawRain(lastDt);
}
let lastT=performance.now();
function loop(now){
  let dt=(now-lastT)/1000; lastT=now; if(dt>0.1)dt=0.1;
  update(dt); if(state.scene==="town")updateNPCs(dt); render(); requestAnimationFrame(loop);
}
function boot(){
  state=defaultState(); const raw=localStorage.getItem(SAVE_KEY);
  if(raw){ try{ state=Object.assign(defaultState(),JSON.parse(raw)); setTimeout(()=>toast("📂 Save dimuat"),600); }catch(e){} }
  else setTimeout(()=>toast("Masuk Kamar (gedung ungu), dekat laptop, tekan E"),700);
  updateHUD(); requestAnimationFrame(loop); window.addEventListener("beforeunload",()=>saveGame(true));
}
boot();
</script>
